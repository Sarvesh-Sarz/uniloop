<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peer Messages — CampusShare</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .messages-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 8rem);
      min-height: 520px;
      margin-top: 1.5rem;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    /* Left: Conversations List */
    .convo-pane {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: #fafafa;
    }
    .convo-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
      font-size: 1.15rem;
      font-weight: 800;
      background: #ffffff;
    }
    .convo-list {
      flex: 1;
      overflow-y: auto;
    }
    .convo-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
      background: #ffffff;
    }
    .convo-item:hover, .convo-item.active {
      background: var(--primary-light);
    }
    .convo-avatar {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .convo-info {
      flex: 1;
      min-width: 0;
    }
    .convo-name {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
    }
    .convo-snippet {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 0.2rem;
    }

    /* Right: Active Chat Thread */
    .chat-pane {
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    .chat-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
    }
    .listing-context-banner {
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: #f8fafc;
    }

    .bubble-row {
      display: flex;
      flex-direction: column;
      max-width: 70%;
    }
    .bubble-row.sent {
      align-self: flex-end;
      align-items: flex-end;
    }
    .bubble-row.received {
      align-self: flex-start;
      align-items: flex-start;
    }
    .bubble {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-lg);
      font-size: 0.925rem;
      line-height: 1.45;
      word-break: break-word;
    }
    .bubble-row.sent .bubble {
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .bubble-row.received .bubble {
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
      box-shadow: var(--shadow-sm);
    }
    .bubble-time {
      font-size: 0.7rem;
      color: var(--text-light);
      margin-top: 0.25rem;
    }

    .chat-input-bar {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
      background: #ffffff;
    }

    @media (max-width: 768px) {
      .messages-layout {
        grid-template-columns: 1fr;
      }
      .convo-pane {
        display: none;
      }
      .convo-pane.show-mobile {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="container main-content">
    <div class="messages-layout">

      <!-- Left Conversations List -->
      <aside class="convo-pane" id="convo-pane">
        <div class="convo-header">Conversations</div>
        <div class="convo-list" id="convo-list">
          <div class="spinner" style="margin-top: 3rem;"></div>
        </div>
      </aside>

      <!-- Right Chat Thread Pane -->
      <main class="chat-pane" id="chat-pane">
        <div class="chat-header" id="chat-header">
          <div style="font-weight: 700;" id="chat-peer-name">Select a conversation</div>
        </div>

        <div class="listing-context-banner" id="listing-banner" style="display: none;">
          <div>Inquiry regarding: <strong id="banner-listing-title">Item</strong></div>
          <a href="#" id="banner-listing-link" class="btn btn-outline-primary btn-sm" style="padding: 0.2rem 0.6rem;">View Item</a>
        </div>

        <div class="chat-messages" id="chat-messages">
          <div class="empty-state" style="margin: auto; border: none; background: transparent;">
            <div class="empty-icon">💬</div>
            <h4>Your Campus In-App Messages</h4>
            <p>Select a peer conversation from the left to view and reply.</p>
          </div>
        </div>

        <form class="chat-input-bar" id="chat-form" style="display: none;">
          <input type="text" id="chat-msg-input" class="form-control" placeholder="Type your message..." autocomplete="off" required>
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </main>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    let activePeerId = null;
    let activeListingId = null;
    let pollInterval = null;

    document.addEventListener("DOMContentLoaded", async () => {
      if (!API.isAuthenticated()) {
        window.location.href = "/login.html";
        return;
      }

      // Check query params (?user_id=...&listing_id=...)
      const params = new URLSearchParams(window.location.search);
      if (params.get("user_id")) {
        activePeerId = parseInt(params.get("user_id"));
      }
      if (params.get("listing_id")) {
        activeListingId = parseInt(params.get("listing_id"));
      }

      await loadConversations();

      if (activePeerId) {
        await openChat(activePeerId, activeListingId);
      }

      // Auto-poll messages every 6 seconds
      pollInterval = setInterval(async () => {
        if (activePeerId) {
          await fetchThreadMessages(activePeerId, false);
        }
      }, 6000);
    });

    async function loadConversations() {
      const list = document.getElementById("convo-list");
      try {
        const convos = await API.request("/api/messages/conversations");
        if (convos.length === 0 && !activePeerId) {
          list.innerHTML = `<div style="padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.85rem;">No active message threads. Message an item owner to get started.</div>`;
          return;
        }

        list.innerHTML = convos.map(c => `
          <div class="convo-item ${activePeerId === c.other_user.id ? 'active' : ''}" onclick="openChat(${c.other_user.id}, ${c.listing_id || 'null'})">
            <div class="convo-avatar">${c.other_user.name.charAt(0).toUpperCase()}</div>
            <div class="convo-info">
              <div class="convo-name">
                <span>${c.other_user.name}</span>
                ${c.unread_count > 0 ? `<span class="badge badge-primary">${c.unread_count}</span>` : ''}
              </div>
              <div style="font-size: 0.75rem; color: var(--text-light);">${c.other_user.department}</div>
              <div class="convo-snippet">${c.last_message}</div>
            </div>
          </div>
        `).join("");
      } catch (err) {
        list.innerHTML = `<div style="padding: 1rem; color: var(--danger);">Failed to load conversations.</div>`;
      }
    }

    async function openChat(peerId, listingId) {
      activePeerId = peerId;
      activeListingId = listingId;

      document.getElementById("chat-form").style.display = "flex";

      // Highlight in list
      document.querySelectorAll(".convo-item").forEach(item => item.classList.remove("active"));

      // Fetch Peer Profile
      try {
        const peer = await API.request(`/api/users/${peerId}/public`);
        document.getElementById("chat-peer-name").innerHTML = `
          <span>${peer.name}</span>
          <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted); margin-left: 0.5rem;">(${peer.department} • Trust: ${peer.trust_score}/100)</span>
        `;
      } catch (e) {}

      // Handle listing banner
      if (listingId) {
        try {
          const l = await API.request(`/api/listings/${listingId}`);
          document.getElementById("banner-listing-title").textContent = l.title;
          document.getElementById("banner-listing-link").href = `/listing.html?id=${l.id}`;
          document.getElementById("listing-banner").style.display = "flex";
        } catch (e) {
          document.getElementById("listing-banner").style.display = "none";
        }
      } else {
        document.getElementById("listing-banner").style.display = "none";
      }

      await fetchThreadMessages(peerId, true);
    }

    async function fetchThreadMessages(peerId, scrollBottom = true) {
      const container = document.getElementById("chat-messages");
      const me = API.getUser();

      try {
        const msgs = await API.request(`/api/messages?other_user_id=${peerId}`);

        if (msgs.length === 0) {
          container.innerHTML = `
            <div class="empty-state" style="margin: auto; border: none; background: transparent;">
              <h4>Start of Conversation</h4>
              <p>Send a message to coordinate campus rentals.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = msgs.map(m => {
          const isMe = m.sender_id === me.id;
          return `
            <div class="bubble-row ${isMe ? 'sent' : 'received'}">
              <div class="bubble">${m.message}</div>
              <div class="bubble-time">${new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
            </div>
          `;
        }).join("");

        if (scrollBottom) {
          container.scrollTop = container.scrollHeight;
        }
      } catch (err) {
        // silent
      }
    }

    document.getElementById("chat-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("chat-msg-input");
      const text = input.value.trim();
      if (!text || !activePeerId) return;

      input.value = "";

      try {
        await API.request("/api/messages", {
          method: "POST",
          body: JSON.stringify({
            receiver_id: activePeerId,
            listing_id: activeListingId || null,
            message: text
          })
        });

        await fetchThreadMessages(activePeerId, true);
        await loadConversations();
      } catch (err) {
        showToast(err.message, "error");
      }
    });
  </script>
</body>
</html>
